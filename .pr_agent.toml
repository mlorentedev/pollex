# PR-Agent (The-PR-Agent/pr-agent, MIT) on NaN cluster inference.
#
# Why this repo needs a second reviewer, measured rather than assumed (2026-09-06,
# the 10 most recent non-dependabot PRs: #47 #50 #51 #52 #63 #64 #65 #66 #67 #71):
#
#   real CodeRabbit review (`## Walkthrough`)    3   (30 %)
#   quota decline (`Review limit reached`)       7   (70 %)
#   `Review skipped`                             0
#
# CodeRabbit is not a check-run in this repository at all, and the required checks on
# master are `lint`, `test`, `build`, `npm audit (site + extension)` and
# `Extension tests (unit + e2e)` — so a declined review leaves no trace in CI. Seven in
# ten PRs here merge with no machine review and nothing says so. That is the queue this
# removes: a reviewer whose capacity is ours rather than a vendor's.
#
# Ported from mlorentedev/ts-bridge, itself ported from mlorentedev/dotfiles
# (`.pr_agent.toml`, TOOL-013 #786) via the mlorentedev/kubelab adaptation (TOOL-021
# #1140). Numbers, paths and the ignore list below are re-derived for this repo; the
# model-chain reasoning is inherited and cited by issue so it can be checked at source.

[config]
# The model, its fallback and the token budgets are set by the shared workflow
# (mlorentedev/ci-workflows pr-agent.yml) through environment variables, which sit
# above this file, so they are not repeated here.

response_language = "en-US"

# `CLAUDE.md` is the only context file that exists here: no root `AGENTS.md` and no
# `.claude/CLAUDE.md` (both checked 2026-09-06), so naming either would hand the
# reviewer a source it cannot read — a rule that looks like rigour and asserts nothing.
repo_context_files = ["CLAUDE.md"]

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_security_review = true
persistent_comment = true
final_update_message = false

# No "compliance sweep" preamble: asked for on every review and delivered once in
# sixteen at dotfiles (#1072, recommendation was deletion). An instruction ignored 94 %
# of the time is a comment, not a control.
extra_instructions = """
Classify each finding as REAL, THEORETICAL or SPECULATIVE. State the class as
the first line of its issue_content, alone on that line and spelled exactly
"Class: REAL", "Class: THEORETICAL" or "Class: SPECULATIVE". The triage reads
only that line; a finding without it goes to a human unclassified.

This repository already runs go vet and gofmt, `go test -race`, Vitest unit tests and
a headed-Chromium Playwright e2e suite for the extension, `npm audit` on site/ and
extension/, and a gremlins mutation run on master. Do not restate what those report;
repeating it is noise that trains the reader to skim.

Spend the budget on what static analysis cannot see:

- a test that passes vacuously: an assertion against a hand-built stand-in instead of
  the production wiring, or an e2e that cannot fail because the mock adapter answers
  every prompt the same way.
- a guard that cannot fail the way its comment claims, or that perturbs the thing it
  measures.
- middleware order and HTTP edge cases in the Go API (auth before rate limit before
  body limit, `http.MaxBytesError` via `errors.As`, sliding-window limiter bounds),
  and the extension's service-worker lifecycle (popup destroyed on focus loss, state
  reconstructed from `chrome.storage`, stale-job detection).
- anything that changes the prompt-injection boundary between user text and the
  system prompt, or that lets model output reach the page unescaped.
- cross-file consequences a single-hunk reader misses: a claim repeated in README,
  `docs/runbooks/`, `site/src/content/docs/` and CLAUDE.md where only one of them is
  edited, or a Makefile target whose documented flags the binary rejects.
- anything that puts a credential in a transcript, a log line, an argv or the process
  table, including in documentation examples and the Jetson deploy scripts.

A REAL finding needs a concrete
trace: file and line, failing input, or a command and its output. Do not flag an import
or dependency as missing when CI compiles and tests pass; trust the manifests. Write in
English. Conventional Commits and no AI attribution are enforced here, so do not propose
commit messages that carry either.
"""

[pr_code_suggestions]
# Present on purpose. Omitting this block is how upstream shipped the tool with its
# stated function disabled: the default `dual_publishing_score_threshold` is -1, which
# never publishes inline (dotfiles measured 2 bot comments and 0 inline across three
# PRs before noticing). 7 is upstream's own medium boundary.
dual_publishing_score_threshold = 7
suggestions_score_threshold = 5
publish_output_no_suggestions = false

[ignore]
# Applied BEFORE the model call. This repo keeps no credential material in-tree (the
# only secrets live in GitHub's own stores and in dotf), so this list is about spend
# and signal, not leakage:
#   - the site build output and Playwright reports are machine artefacts;
#   - the two npm lockfiles (7k and 1.3k lines of resolved URLs) were reviewed in the
#     Dependabot PRs that bumped them, and lockfiles are excluded from the review cap
#     by policy;
#   - archived specs are a closed audit trail, re-reviewing them spends inference on
#     text that has already been reviewed once;
#   - CHANGELOG.md is written by release-please from commits that were each reviewed.
glob = [
  "site/dist/**",
  "site/package-lock.json",
  "extension/package-lock.json",
  "specs/archive/**",
  "playwright-report/**",
  "test-results/**",
  "**/*.log",
  "coverage.out",
  "CHANGELOG.md",
]
