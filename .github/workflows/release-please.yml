name: Release Please

on:
  push:
    branches: [master]

# Least privilege: each job declares its own permissions. release-please
# authenticates as the fine-grained RELEASE_TOKEN (contents + pull-requests
# write, repo-scoped); goreleaser uploads assets with the default GITHUB_TOKEN.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # Fine-grained PAT: repo-scoped to mlorentedev/pollex, Contents + PR write.
          token: ${{ secrets.RELEASE_TOKEN }}

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package extension
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: cd extension && zip -r "../pollex-extension-${TAG}.zip" . -x '*.gitkeep' -x '*.svg'

      - name: Upload extension zip
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: pollex-extension-${{ needs.release-please.outputs.tag_name }}.zip
