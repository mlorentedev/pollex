name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: test -z "$(gofmt -l ./...)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test -v -race ./...

  test-extension:
    name: Extension tests (unit + e2e)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install extension test deps
        run: cd extension && npm ci
      - name: Install Playwright Chromium
        run: cd extension && npx playwright install chromium --with-deps
      - name: Run unit tests
        run: cd extension && npm test
      # Extension e2e needs a headed Chromium (no headless-shell support);
      # xvfb provides the virtual display on the runner.
      - name: Run e2e tests (xvfb)
        run: cd extension && xvfb-run --auto-servernum npm run test:e2e

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build -o dist/pollex ./cmd/pollex
      - run: GOOS=linux GOARCH=arm64 go build -o dist/pollex-arm64 ./cmd/pollex

  mutation:
    name: Mutation Testing (adapter + config)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - name: Mutate adapter package
        run: gremlins unleash --timeout-coefficient 5 ./internal/adapter
      - name: Mutate config package
        run: gremlins unleash --timeout-coefficient 5 ./internal/config
