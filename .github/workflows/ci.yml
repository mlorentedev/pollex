name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: test -z "$(gofmt -l ./...)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - run: go test -v -race ./...

  test-extension:
    name: Extension tests (unit + e2e)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install extension test deps
        run: cd extension && npm ci
      - name: Install Playwright Chromium
        run: cd extension && npx playwright install chromium --with-deps
      - name: Run unit tests
        run: cd extension && npm test
      # Extension e2e needs a headed Chromium (no headless-shell support);
      # xvfb provides the virtual display on the runner.
      - name: Run e2e tests (xvfb)
        run: cd extension && xvfb-run --auto-servernum npm run test:e2e

  audit:
    name: npm audit (site + extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            extension/package-lock.json
      - name: Install deps
        run: cd site && npm ci && cd ../extension && npm ci
      # Gate: fail on any high/critical advisory. Dependabot keeps this green;
      # a red here means a dependency needs an upgrade before merging.
      - name: Audit site
        run: cd site && npm audit --audit-level=high
      - name: Audit extension
        run: cd extension && npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - run: go build -o dist/pollex ./cmd/pollex
      - run: GOOS=linux GOARCH=arm64 go build -o dist/pollex-arm64 ./cmd/pollex

  mutation:
    name: Mutation Testing (adapter + config)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache: true
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - name: Mutate adapter package
        run: gremlins unleash --timeout-coefficient 5 ./internal/adapter
      - name: Mutate config package
        run: gremlins unleash --timeout-coefficient 5 ./internal/config
