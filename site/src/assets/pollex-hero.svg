<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>

  <!-- Browser window frame -->
  <rect x="40" y="30" width="200" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Title bar -->
  <circle cx="56" cy="44" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="70" cy="44" r="4" fill="#eab308" opacity="0.8"/>
  <circle cx="84" cy="44" r="4" fill="#22c55e" opacity="0.8"/>
  <!-- Text lines (input) -->
  <rect x="56" y="65" width="120" height="4" rx="2" fill="#94a3b8" opacity="0.5"/>
  <rect x="56" y="77" width="100" height="4" rx="2" fill="#94a3b8" opacity="0.4"/>
  <rect x="56" y="89" width="110" height="4" rx="2" fill="#94a3b8" opacity="0.3"/>
  <!-- Red underlines (errors) -->
  <line x1="76" y1="71" x2="108" y2="71" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>
  <line x1="56" y1="83" x2="82" y2="83" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>

  <!-- Arrow -->
  <line x1="250" y1="105" x2="290" y2="105" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="284,99 292,105 284,111" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sparkle on arrow -->
  <path d="M270 92 L271.5 96 L275.5 97.5 L271.5 99 L270 103 L268.5 99 L264.5 97.5 L268.5 96Z" fill="#0e7490" opacity="0.6"/>

  <!-- Polished output card -->
  <rect x="300" y="55" width="70" height="100" rx="8" fill="#0e7490" opacity="0.12" stroke="#0e7490" stroke-width="1"/>
  <!-- Clean text lines -->
  <rect x="312" y="75" width="46" height="4" rx="2" fill="#0e7490" opacity="0.8"/>
  <rect x="312" y="87" width="38" height="4" rx="2" fill="#0e7490" opacity="0.65"/>
  <rect x="312" y="99" width="42" height="4" rx="2" fill="#0e7490" opacity="0.5"/>
  <!-- Checkmark -->
  <circle cx="335" cy="130" r="8" fill="#0e7490" opacity="0.2"/>
  <polyline points="330,130 333,133.5 340,126" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Jetson board (bottom) -->
  <rect x="80" y="210" width="120" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- GPU chip -->
  <rect x="105" y="225" width="30" height="22" rx="3" fill="#0e7490" opacity="0.3" stroke="#0e7490" stroke-width="1"/>
  <text x="120" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#0e7490" font-weight="600">GPU</text>
  <!-- Heatsink lines -->
  <line x1="145" y1="228" x2="175" y2="228" stroke="#475569" stroke-width="1"/>
  <line x1="145" y1="233" x2="175" y2="233" stroke="#475569" stroke-width="1"/>
  <line x1="145" y1="238" x2="175" y2="238" stroke="#475569" stroke-width="1"/>
  <line x1="145" y1="243" x2="175" y2="243" stroke="#475569" stroke-width="1"/>
  <!-- Board label -->
  <text x="140" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">Jetson Nano 4GB</text>

  <!-- Connection line from board to browser -->
  <line x1="140" y1="210" x2="140" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Metrics sparkline (bottom right) -->
  <rect x="240" y="210" width="130" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.7"/>
  <text x="252" y="226" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">latency p50</text>
  <text x="330" y="226" text-anchor="end" font-family="system-ui, sans-serif" font-size="7" fill="#22c55e">3.2s</text>
  <polyline points="252,240 262,242 272,238 282,244 292,236 302,240 312,235 322,239" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="252" y="258" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">availability</text>
  <text x="330" y="258" text-anchor="end" font-family="system-ui, sans-serif" font-size="7" fill="#22c55e">99.8%</text>
  <rect x="252" y="262" width="70" height="4" rx="2" fill="#22c55e" opacity="0.3"/>
  <rect x="252" y="262" width="69.5" height="4" rx="2" fill="#22c55e" opacity="0.6"/>
</svg>
